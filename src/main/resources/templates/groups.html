<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academic Groups</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:insert="fragments/general.html :: header"> </header>
<div class="container text-center">
    <div class="row align-items-start">
        <div class="col">
            <h2>Academic Groups</h2>
            <div class="d-grid">
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_group" data-bs-ident="#add" th:attr="data-bs-link=@{/groups/add}">
                    <i class="bi bi-plus"></i> Add Academic Group</a>
                <table class="table table-striped table-sm table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Group</th>
                        <th>Major</th>
                        <th>Department</th>
                        <th>Curator</th>
                        <th><i class="bi bi-people"></i> Students</th>
                        <th><i class="bi bi-pencil"></i></th>
                        <th><i class="bi bi-trash"></i></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="g : ${groups}">
                        <td th:text="${g.id}"></td>
                        <td th:text="${g.name}"></td>
                        <td th:text="${g.major.title}" style="text-align: left;"></td>
                        <td th:text="${g.department.name}" style="text-align: left;"></td>
                        <td th:text="${g.curator.firstName} + ' ' + ${g.curator.lastName}" style="text-align: left;"></td>
                        <td><a class="btn btn-sm btn-info" th:href="@{/groups/students(id=${g.id})}"><i class="bi bi-people"></i> </a> </td>
                        <td>
<!--                            <a class="btn btn-sm btn-warning" th:href="@{/groups/edit(id=${g.id})}"><i class="bi bi-pencil"></i></a>-->
                            <a class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#add_group" data-bs-ident="#edit"
                               th:attr="data-bs-link=@{/groups/edit},
                                data-bs-id=${g.id},
                                data-bs-name=${g.name},
                                data-bs-maj-id=${g.major.id},
                                data-bs-prof-id=${g.curator.id},
                                data-bs-dept-id=${g.department.id}"
                                ><i class="bi bi-pencil"></i></a>
                        </td>
                        <td>
                            <a class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                               th:attr="data-bs-link=@{/groups/delete(id=${g.id})}, data-bs-text = ${g.name}, data-bs-id = ${g.id}">
                                <i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- add group dialog -->
<div class="modal fade" id="add_group" tabindex="-1" aria-labelledby="staticEditLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <form id="add_group_form" method="post" action="/groups/add">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title text-danger fs-4" id="staticEditLabel">Add Group</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="text-align: left;">
                    <input type="hidden" id="group_id" name="group_id">
                    <table>
                        <tr>
                            <td><label for="group_name">Group Name:</label></td>
                            <td><input type="text" id="group_name" name="group_name" required></td>
                        </tr>
                        <tr>
                            <td>
                                <label for="group_majors">Major:</label>
                            </td>
                            <td>
                                <select class="form-control maj-list" id="group_majors" name="major_id" required>
                                    <option value="" selected >Choose Major:</option>
                                    <option th:each="m : ${majors}" th:value="${m.id}" th:text="${m.title}"></option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="group_departments">Department:</label>
                            </td>
                            <td>
                                <select class="form-control dept-list" id="group_departments" name="dept_id" required>
                                    <option value="" selected >Choose Department:</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="group_curators">Curator:</label>
                            </td>
                            <td>
                                <select class="form-control curator-list" id="group_curators" name="prof_id" required>
                                    <option value="" selected >Choose Curator:</option>
                                    <option th:each="p : ${professors}" th:value="${p.id}" th:text="${p.firstName} + ' ' + ${p.lastName}"></option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <input type="submit" class="btn btn-success change-button" value="Add"/>
                </div>
            </div>
        </div>
    </form>
</div>
<!-- end add group -->

<span th:insert="fragments/general.html :: confirm"> </span>

<script src="/js/groups.js"></script>
<script src="/js/confirm.js"></script>
<script th:src="@{/webjars/bootstrap/5.3.5/dist/js/bootstrap.min.js}"></script>
</body>
</html>
