<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>University App</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:insert="fragments/general.html :: header"> </header>
<div class="container text-center">
    <div class="row align-items-start">
        <div class="col">
            <h2>Cities</h2>
            <div class="d-grid">
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_city" data-bs-ident="#add"
                   th:attr="data-bs-link=@{/cities/add}">
                    <i class="bi bi-plus"></i> Add City</a>
            </div>
            <table class="table table-striped table-sm table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>City</th>
                        <th><i class="bi bi-pencil"></i></th>
                        <th><i class="bi bi-trash"></i></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="city : ${cities}">
                        <td th:text="${city.id}"></td>
                        <td th:text="${city.name}" style="text-align: left;"></td>
                        <td>
                            <a class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#add_city" data-bs-ident="#edit"
                               th:attr="data-bs-link=@{/cities/edit_city},
                                        data-bs-id=${city.id},
                                        data-bs-name=${city.name}" >
                                <i class="bi bi-pencil"></i></a></td>
                        <td>
                            <a class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                               th:attr="data-bs-link=@{/cities/delete(id=${city.id})}, data-bs-text = ${city.name}, data-bs-id = ${city.id}">
                                <i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col">
            <h2>Positions</h2>
            <div class="d-grid">
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_position" data-bs-ident="#add" th:attr="data-bs-link=@{/positions/add}">
                    <i class="bi bi-plus"></i> Add Position</a>
            </div>
            <table class="table table-striped table-sm table-hover">
                <thead class="table-secondary">
                <tr>
                    <th>#</th>
                    <th>Position</th>
                    <td><i class="bi bi-pencil"></i></td>
                    <td><i class="bi bi-trash"></i></td>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="position : ${positions}">
                        <td th:text="${position.id}"></td>
                        <td th:text="${position.title}" style="text-align: left;"></td>
                        <td>
                            <a class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#add_position" data-bs-ident="#edit"
                               th:attr="data-bs-link=@{/positions/edit_position},
                                        data-bs-id=${position.id},
                                        data-bs-title=${position.title}" >
                                <i class="bi bi-pencil"></i></a>
                        </td>
                        <td>
                            <a class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                               th:attr="data-bs-link=@{/positions/delete(id=${position.id})}, data-bs-text = ${position.title}, data-bs-id = ${position.id}">
                                <i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col">
            <h2>Majors</h2>
            <div class="d-grid">
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_major" data-bs-ident="#add" th:attr="data-bs-link=@{/majors/add}">
                    <i class="bi bi-plus"></i> Add Major</a>
            </div>
            <table class="table table-sm table-hover table-striped">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Major</th>
                    <th>Code</th>
                    <th><i class="bi bi-pencil"></i></th>
                    <th><i class="bi bi-trash"></i></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="major : ${majors}">
                    <td th:text="${major.id}"></td>
                    <td th:text="${major.title}" style="text-align: left;"></td>
                    <td th:text="${major.code}" ></td>
                    <td>
                        <a class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#add_major" data-bs-ident="#edit"
                           th:attr="data-bs-link=@{/majors/edit_major},
                                    data-bs-id=${major.id},
                                    data-bs-title=${major.title},
                                    data-bs-code=${major.code}" >
                            <i class="bi bi-pencil"></i></a>
                    </td>
                    <td>
                        <a class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                           th:attr="data-bs-link=@{/majors/delete(id=${major.id})}, data-bs-text = ${major.title} + ' ' + ${major.code}, data-bs-id = ${major.id}">
                            <i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- confirm dialog -->
<div class="modal fade" id="myconfirm" tabindex="-1" aria-labelledby="staticWarningLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title text-danger fs-4" id="staticWarningLabel">Warning</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete <span id="modal-text" class="modal-text text-danger"></span>?<br/>
                If you click Delete, this <i>cannot be undone</i>!
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <a th:method="delete" class="btn btn-danger delete-button">Delete</a>
            </div>
        </div>
    </div>
</div>
<!-- end confirm -->
<!-- Add City Dialog -->
<div class="modal fade" id="add_city" tabindex="-1" aria-labelledby="staticAddLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add_city_form" method="post">
                <input id="mid" type="hidden" name="_method">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="staticAddCityLabel">Add City</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="city_id" name="city_id">
                    <table>
                        <tr>
                            <td><label for="city_name">City Name:</label></td>
                            <td><input id="city_name" type="text" name="city_name"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button id="approve_city" type="submit" class="btn btn-primary add-button">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Add City-->
<!-- Add Position Dialog -->
<div class="modal fade" id="add_position" tabindex="-1" aria-labelledby="staticAddLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add_position_form" method="post">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="staticAddPositionLabel">Add Position</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="position_id" name="position_id">
                    <table>
                        <tr>
                            <td><label for="position_title">Position Title:</label></td>
                            <td><input id="position_title" type="text" name="position_title"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button id="approve_position" type="submit" class="btn btn-primary add-button">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Add Position-->
<!-- Add Major Dialog -->
<div class="modal fade" id="add_major" tabindex="-1" aria-labelledby="staticAddLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add_major_form" method="post">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="staticAddMajorLabel">Add City</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="major_id" name="major_id">
                    <table>
                        <tr>
                            <td><label for="major_title">Major Title:</label></td>
                            <td><input id="major_title" type="text" name="major_title"></td>
                        </tr>
                        <tr>
                            <td><label for="major_code">Major Code:</label></td>
                            <td><input id="major_code" type="text" name="major_code"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button id="approve_major" type="submit" class="btn btn-primary add-button">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Add Major-->
    <script src="/js/confirm.js"></script>
    <script src="/js/cities.js"></script>
    <script src="/js/positions.js"></script>
    <script src="/js/majors.js"></script>
    <script th:src="@{/webjars/bootstrap/5.3.5/dist/js/bootstrap.min.js}"></script>
</body>
</html>
