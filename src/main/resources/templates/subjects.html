<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subjects</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:insert="fragments/general.html :: header"></header>

<div class="container text-center">
    <div class="row align-items-start">
        <div class="col">
            <h2>Subjects</h2>
            <div class="d-grid">
                <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_subject" data-bs-ident="#add"
                   th:attr="data-bs-link=@{/subjects/add}">
                    <i class="bi bi-plus"></i> Add Subject</a>
            </div>
            <table class="table table-striped table-sm table-hover">
                <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Subject</th>
                    <th>Semester</th>
                    <th>Duration</th>
                    <th>Description</th>
                    <th><i class="bi bi-pencil"></i></th>
                    <th><i class="bi bi-trash"></i></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${subjects}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.title}" style="text-align: left;"></td>
                    <td th:text="${s.semestr}"></td>
                    <td th:text="${s.duration}"></td>
                    <td th:text="${s.description}" style="text-align: left;"></td>
                    <td>
                        <a class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#add_subject"
                           data-bs-ident="#edit"
                           th:attr="data-bs-link=@{/subjects/edit},
                                            data-bs-id=${s.id},
                                            data-bs-title=${s.title},
                                            data-bs-semester=${s.semestr},
                                            data-bs-duration=${s.duration},
                                            data-bs-description=${s.description}
                            ">
                            <i class="bi bi-pencil"></i></a></td>
                    <td>
                        <a class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#myconfirm"
                           th:attr="data-bs-link=@{/subjects/delete(id=${s.id})}, data-bs-text = ${s.title}, data-bs-id = ${s.id}">
                            <i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- Add Subject Dialog -->
<div class="modal fade" id="add_subject" tabindex="-1" aria-labelledby="staticAddLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add_subject_form" method="post">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="staticAddLabel">Add Subject</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="subject_id" name="subject_id">
                    <table>
                        <tr>
                            <td><label for="subject_title">Title:</label></td>
                            <td><input id="subject_title" type="text" name="subject_title"></td>
                        </tr>
                        <tr>
                            <td><label for="subject_semester">Semester:</label></td>
                            <td><input id="subject_semester" type="number" name="subject_semester"></td>
                        </tr>
                        <tr>
                            <td><label for="subject_duration">Duration:</label></td>
                            <td><input id="subject_duration" type="number" name="subject_duration"></td>
                        </tr>
                        <tr>
                            <td><label for="subject_description">Description:</label></td>
                            <td><textarea id="subject_description" name="subject_description" rows="5" cols="45"></textarea></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button id="approve_subject" type="submit" class="btn btn-primary add-button">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Add Subject-->

<span th:insert="fragments/general.html :: confirm"> </span>

<script src="/js/subjects.js"></script>
<script th:src="@{/webjars/bootstrap/5.3.5/dist/js/bootstrap.min.js}"></script>
</body>
</html>
