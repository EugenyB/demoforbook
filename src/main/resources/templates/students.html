<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:insert="fragments/general.html :: header"> </header>
<div class="container text-center">
    <div class="row align-items-start">
        <h2 th:if="${group!=null}"> Group: <span th:text="${group.name}"></span>  </h2>
        <h2 th:if="${group==null}">All Students</h2>
    </div>
</div>
<div class="container text-center">
    <div class="row align-items-start">
        <div class="col">
<div class="d-grid">
    <a class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_student" data-bs-ident="#add" th:attr="data-bs-link=@{/students/add}">
        <i class="bi bi-plus"></i> Add Student</a>
</div>
<table class="table table-striped table-sm table-hover">
    <thead class="table-primary">
        <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Birthday</th>
            <th>City</th>
            <th>Address</th>
            <th th:if="${group==null}">Group</th>
            <th><i class="bi bi-pencil"></i></th>
            <th><i class="bi bi-trash"></i></th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.firstName} + ' ' + ${s.lastName}" style="text-align: left;"></td>
        <td th:text="${s.birthday}"></td>
        <td th:text="${s.city.name}"></td>
        <td th:text="${s.streetAddress}"></td>
        <td th:if="${group==null}" th:text="${s.group.name}"></td>
        <td>
            <a class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#add_student" data-bs-ident="#edit"
               th:attr="data-bs-link=@{/students/edit},
            data-bs-id=${s.id},
            data-bs-first-name=${s.firstName},
            data-bs-last-name=${s.lastName},
            data-bs-birthday=${s.birthday},
            data-bs-address=${s.streetAddress},
            data-bs-city-id=${s.city.id},
            data-bs-group-id=${s.group.id}"
            ><i class="bi bi-pencil"></i></a>
        </td>
        <td>
<!--            <a class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>-->
            <a class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#myconfirm"
            th:attr="data-bs-link=@{/students/delete(id=${s.id})}, data-bs-text = ${s.firstName} + ' ' + ${s.lastName}, data-bs-id = ${s.id}"
            ><i class="bi bi-trash"></i></a>
        </td>
    </tr>
    </tbody>
</table>
        </div>
    </div>
</div>
<!-- add student dialog -->
<div class="modal fade" id="add_student" tabindex="-1" aria-labelledby="staticEditLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <form id="add_student_form" method="post" action="/students/add">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title text-danger fs-4" id="staticEditLabel">Add Student</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="text-align: left;">
                    <input type="hidden" id="student_id" name="student_id">
                    <input type="hidden" th:if="${group!=null}" name="flag" value="1">
                    <input type="hidden" th:if="${group==null}" name="flag" value="0">
                    <table>
                        <tr>
                            <td><label for="student_first_name">First Name:</label></td>
                            <td><input type="text" id="student_first_name" name="student_first_name" required></td>
                        </tr>
                        <tr>
                            <td><label for="student_last_name">Last Name:</label></td>
                            <td><input type="text" id="student_last_name" name="student_last_name" required></td>
                        </tr>
                        <tr>
                            <td><label for="student_birthday">Birthday:</label></td>
                            <td><input type="date" id="student_birthday" name="student_birthday" required></td>
                        </tr>
                        <tr>
                            <td>
                                <label for="student_cities">City:</label>
                            </td>
                            <td>
                                <select class="form-control city-list" id="student_cities" name="city_id" required>
                                    <option value="" selected >Choose City:</option>
                                    <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="student_address">Address:</label></td>
                            <td><input type="text" id="student_address" name="student_address"></td>
                        </tr>
                        <tr>
                            <td>
                                <label for="student_groups">Academic group:</label>
                            </td>
                            <td>
                                <select class="form-control dept-list" id="student_groups" name="group_id" required>
                                    <option value="" selected >Choose Group:</option>
                                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"></option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <input type="submit" class="btn btn-success change-button" value="Add"/>
                </div>
            </div>
        </div>
    </form>
</div>
<!-- end add student -->

<span th:insert="fragments/general.html :: confirm"> </span>

<script src="/js/students.js"></script>
<script src="/js/confirm.js"></script>
<script th:src="@{/webjars/bootstrap/5.3.5/dist/js/bootstrap.min.js}"></script>
</body>
</html>
